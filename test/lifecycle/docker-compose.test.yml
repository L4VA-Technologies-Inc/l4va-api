# Throwaway services for the lifecycle integration suite. Ports are deliberately
# different from the dev (5432/6379) and mainnet-copy (5433/6380) containers.
name: l4va-lifecycle-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: l4va_lifecycle_test
    ports:
      - '5544:5432'
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: redis:7
    ports:
      - '6390:6379'

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ['anvil']
    # The vault deployer embeds the full vault bytecode, which is over the EIP-170 limit.
    command: ['--host', '0.0.0.0', '--chain-id', '31337', '--disable-code-size-limit', '--silent']
    ports:
      - '8546:8545'
